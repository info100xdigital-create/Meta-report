name: Daily Meta Ads Report

on:
  schedule:
    - cron: '30 3 * * 1-6'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install facebook_business pillow requests cloudinary

      - name: Run report script
        run: python image_report.py

      - name: Commit and push results
        run: |
          git config user.name "100X Digital Bot"
          git config user.email "info100xdigital@gmail.com"
          git add docs/results.json
          git add reports/ || true
          git diff --staged --quiet || git commit -m "Daily report: $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
